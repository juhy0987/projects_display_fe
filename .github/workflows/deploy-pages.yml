name: Deploy to GitHub Pages

# main 머지 시 dist/ 를 GitHub Pages artifact 로 업로드해서 자동 배포한다.
# Required Status Check 대상이 아님 — 머지 게이트 워크플로(ci-quality, ci-convention)와 분리.
#
# 트리거:
#   - push to main: main 으로 머지된 변경을 즉시 반영
#   - workflow_dispatch: 수동 재배포 (VITE_API_BASE_URL 변경 후 즉시 반영 용도 등)

on:
  push:
    branches: [main]
  workflow_dispatch:

# Pages 배포에 필요한 최소 권한 set — id-token 은 OIDC 기반 deploy-pages 가 요구
permissions:
  contents: read
  pages: write
  id-token: write

# 동시 배포 큐 보호 — 진행 중인 배포는 보존, 신규는 큐잉
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        # VITE_API_BASE_URL 은 Repository Variables 로 주입 (Settings → Secrets and variables → Actions → Variables).
        # 미설정이면 빈 문자열 → src/api/client.ts 의 BASE = "" 분기로 graceful degrade (정적 화면만 동작).
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
        run: npm run build

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
